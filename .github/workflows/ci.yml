name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas
        run: npm test
      - name: Herramienta ASCII con el nivel de ejemplo
        run: python3 herramientas/render_layout.py datos/nivel.json
